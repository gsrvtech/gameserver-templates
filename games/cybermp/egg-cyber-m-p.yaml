scripts:
  installation:
    script: |-
      #!/bin/bash
      # ------------------------------------------------
      # Installscript for CyberMP (Pelican Egg - Linux)
      # License: AGPLv3
      # Author: gOOvER (https://discord.goover.dev)
      # Donate: https://donate.goover.dev
      # ------------------------------------------------

      set -euo pipefail

      # ----------------------------
      # Environment Setup
      # ----------------------------
      HOME=/mnt/server
      export HOME
      chown -R root:root /mnt

      GAME_NAME="CyberMP"
      REPO="Cyber-MP/CyberMP-Server-Releases"
      SERVER_VERSION="${SERVER_VERSION:-latest}"

      # ----------------------------
      # Locale Setup
      # ----------------------------
      export LANG=en_US.UTF-8
      export LANGUAGE=en_US:en
      export LC_ALL=en_US.UTF-8

      # ----------------------------
      # Logging & Colors
      # ----------------------------
      SAFE_NAME="${GAME_NAME// /_}_install.log"
      INSTALL_LOG="$HOME/$SAFE_NAME"
      : > "$INSTALL_LOG"

      RED=$(tput setaf 1 2>/dev/null || echo "")
      GREEN=$(tput setaf 2 2>/dev/null || echo "")
      YELLOW=$(tput setaf 3 2>/dev/null || echo "")
      BLUE=$(tput setaf 4 2>/dev/null || echo "")
      CYAN=$(tput setaf 6 2>/dev/null || echo "")
      BOLD=$(tput bold 2>/dev/null || echo "")
      NC=$(tput sgr0 2>/dev/null || echo "")

      print_step() {
          echo "${BLUE}│${NC}  ${CYAN}→${NC} $*"
          echo "$(date '+%Y-%m-%d %H:%M:%S') [STEP] $*" >> "$INSTALL_LOG"
      }
      print_ok() {
          echo "${BLUE}│${NC}  ${GREEN}✓${NC} $*"
          echo "$(date '+%Y-%m-%d %H:%M:%S') [OK] $*" >> "$INSTALL_LOG"
      }
      print_warn() {
          echo "${BLUE}│${NC}  ${YELLOW}⚠${NC} $*"
          echo "$(date '+%Y-%m-%d %H:%M:%S') [WARN] $*" >> "$INSTALL_LOG"
      }
      print_error() {
          echo "${BLUE}│${NC}  ${RED}✗${NC} $*" >&2
          echo "$(date '+%Y-%m-%d %H:%M:%S') [ERROR] $*" >> "$INSTALL_LOG"
      }

      # ----------------------------
      # Dependencies
      # ----------------------------
      echo ""
      echo "${BLUE}┌─ ${CYAN}${BOLD}Installing Dependencies${NC}"
      print_step "Adding Debian bullseye repository for libssl1.1..."
      echo "deb http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list.d/bullseye.list
      print_step "Updating apt and installing required packages..."
      export DEBIAN_FRONTEND=noninteractive
      apt-get update >> "$INSTALL_LOG" 2>&1
      apt-get install -y --no-install-recommends libssl1.1 libnng1 libc-ares2 libatomic1 libcurl3-gnutls >> "$INSTALL_LOG" 2>&1
      print_ok "Dependencies installed"
      echo "${BLUE}└─${NC}"

      # ----------------------------
      # Download & Extract
      # ----------------------------
      echo ""
      echo "${BLUE}┌─ ${CYAN}${BOLD}Downloading ${GAME_NAME}${NC}"
      mkdir -p "$HOME"
      cd "$HOME"

      if [ -z "${SERVER_VERSION}" ] || [ "${SERVER_VERSION}" = "latest" ]; then
          RELEASE_URL="https://api.github.com/repos/${REPO}/releases/latest"
      else
          TAG="${SERVER_VERSION}"
          if [[ "${TAG}" != v* ]]; then
              TAG="v${TAG}"
          fi
          RELEASE_URL="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
      fi

      print_step "Resolving release from ${RELEASE_URL}..."
      DOWNLOAD_URL=$(curl -fsSL "${RELEASE_URL}" | jq -r '.assets[] | select((.name | startswith("cybermp-server-linux-build")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

      if [ -z "${DOWNLOAD_URL}" ] || [ "${DOWNLOAD_URL}" = "null" ]; then
          print_error "Could not find a Linux server build for version '${SERVER_VERSION}'"
          exit 1
      fi

      print_step "Downloading ${DOWNLOAD_URL}..."
      curl -fsSL -o cybermp-server.zip "${DOWNLOAD_URL}"

      if [ -f server.toml ]; then
          print_step "Backing up existing server.toml..."
          mv server.toml server.toml.keep
      fi

      print_step "Extracting server archive..."
      unzip -o -q cybermp-server.zip
      rm -f cybermp-server.zip

      if [ -f server.toml.keep ]; then
          mv -f server.toml.keep server.toml
          print_ok "Restored existing server.toml"
      fi

      mkdir -p resources

      if [ ! -f server.toml ]; then
          print_step "Downloading default server.toml..."
          curl -fsSL -o server.toml "https://raw.githubusercontent.com/${REPO}/main/server.toml"
      fi

      ## Upstream default still uses the old key name
      sed -i 's/^disable_VoIP_server/disable_voice/' server.toml

      chmod +x cybermp-server
      if [ -f bin/crashpad_handler ]; then
          chmod +x bin/crashpad_handler
      fi
      print_ok "Server files extracted"
      echo "${BLUE}└─${NC}"

      # ----------------------------
      # Bundle Shared Libraries
      # ----------------------------
      echo ""
      echo "${BLUE}┌─ ${CYAN}${BOLD}Bundling Shared Libraries${NC}"
      if ldd ./cybermp-server | grep -q "not found"; then
          print_error "Missing libraries detected:"
          ldd ./cybermp-server | grep "not found" >&2
          exit 1
      fi

      rm -rf libs
      mkdir -p libs
      for BIN in ./cybermp-server ./bin/crashpad_handler; do
          if [ -f "${BIN}" ]; then
              ldd "${BIN}" | awk '$2 == "=>" {print $3}' | grep '^/' || true
          fi
      done | sort -u | while read -r LIB; do
          case "$(basename "${LIB}")" in
              libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|ld-linux*|libstdc++.so.*|libgcc_s.so.*)
                  ;;
              *)
                  cp -L "${LIB}" libs/
                  ;;
          esac
      done
      print_ok "Shared libraries bundled into ./libs"
      echo "${BLUE}└─${NC}"

      # ----------------------------
      # Post-Installation Verification
      # ----------------------------
      echo ""
      echo "${BLUE}┌─ ${CYAN}${BOLD}Post-Installation Verification${NC}"
      if [[ -x "$HOME/cybermp-server" ]]; then
          print_ok "Binary ready: cybermp-server"
      else
          print_error "cybermp-server binary missing or not executable"
          exit 1
      fi
      if [[ -f "$HOME/server.toml" ]]; then
          print_ok "Config ready: server.toml"
      else
          print_warn "server.toml not found"
      fi
      print_ok "Verification completed"
      echo "${BLUE}└─${NC}"

      # ----------------------------
      # Done
      # ----------------------------
      echo ""
      echo "${BLUE}╔════════════════════════════════════════════════════════════════╗${NC}"
      printf "${BLUE}║${NC}%21s${GREEN}${BOLD}%s${NC}%21s${BLUE}║${NC}\n" "" "INSTALLATION COMPLETED" ""
      echo "${BLUE}╠════════════════════════════════════════════════════════════════╣${NC}"
      printf "${BLUE}║${NC}  ${GREEN}[OK]${NC} %-57s${BLUE}║${NC}\n" "${GAME_NAME} successfully installed"
      printf "${BLUE}║${NC}  Log: %-57s${BLUE}║${NC}\n" "$INSTALL_LOG"
      printf "${BLUE}║${NC}  Support: %-53s${BLUE}║${NC}\n" "https://donate.goover.dev"
      echo "${BLUE}╚════════════════════════════════════════════════════════════════╝${NC}"
      echo ""

      exit 0
    container: 'ghcr.io/goover/installers:debian'
    entrypoint: bash
